name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Release builds use Xcode 27, so CI builds and checks the string catalog
    # with the same compiler and tools. Move back to macos-latest once that
    # image defaults to Xcode 27.
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Check the string catalog matches the code
        run: bash scripts/sync-strings.sh --check

      # Ad hoc signing: the release identity is not available on CI.
      - name: Build the app bundle
        run: bash scripts/bundle.sh --identity adhoc

  shellcheck:
    # shellcheck ships on the Ubuntu image but not on the macOS one.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
